name: ipah
region: fra

static_sites:
  - name: ipah-site
    environment_slug: html
    git:
      repo_clone_url: https://github.com/Creatortelegramapp/ipah.git
      branch: main
    source_dir: /
    build_command: >-
      rm -rf dist && mkdir dist && cp -R assets en hy ru dist/ && cp index.html 404.html robots.txt site.webmanifest sitemap.xml dist/
    output_dir: dist
    index_document: index.html
    error_document: 404.html
