name: ipah
region: fra
domains:
  - domain: ipah.am
    type: PRIMARY
  - domain: www.ipah.am
    type: PRIMARY
static_sites:
  - name: ipah-site
    environment_slug: html
    github:
      repo: Creatortelegramapp/ipah
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: >-
      rm -rf dist && mkdir dist && cp -R assets en hy ru dist/ && cp index.html 404.html robots.txt site.webmanifest sitemap.xml dist/
    output_dir: dist
    index_document: index.html
    error_document: 404.html
